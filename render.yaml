services:
  - type: web
    name: click-opticx-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://isp-click-opticx.web.app,https://isp-click-opticx.firebaseapp.com"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # Optional, will fallback to memory if not provided

