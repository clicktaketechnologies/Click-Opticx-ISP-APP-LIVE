<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Click Opticx ISP System v8.6.0</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1570ef">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html,
        body,
        #root {
            font-family: 'Inter', sans-serif;
            overflow: visible !important;
            height: auto !important;
            min-height: 100% !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior: auto !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes loading-bar {
            0% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .animate-loading-bar {
            animation: loading-bar 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes premium-fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .animate-premium {
            animation: premium-fade-in 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes progress-glow {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }
        .animate-progress-glow {
            animation: progress-glow 2s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }
        .animate-shimmer {
            animation: shimmer 1.5s infinite;
        }

        /* Global Modal SaaS Redesign */
        .modal, [data-modal] {
            background: #FFFFFF !important;
            color: #0F172A !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15) !important;
            border: 1px solid #E2E8F0 !important;
        }

        .modal input, 
        .modal select, 
        .modal textarea,
        [data-modal] input,
        [data-modal] select,
        [data-modal] textarea {
            background: #F8FAFC !important;
            border: 1px solid #E2E8F0 !important;
            color: #0F172A !important;
            border-radius: 10px !important;
            padding: 10px 12px !important;
            font-size: 14px !important;
            transition: all 0.2s ease-out !important;
            outline: none !important;
        }

        .modal input:focus, 
        .modal select:focus, 
        .modal textarea:focus,
        [data-modal] input:focus,
        [data-modal] select:focus,
        [data-modal] textarea:focus {
            border-color: #3B82F6 !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1) !important;
            background: #FFFFFF !important;
        }

        .modal label, [data-modal] label {
            color: #334155 !important;
            font-weight: 600 !important;
            font-size: 11px !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            margin-bottom: 6px !important;
            display: block !important;
        }

        .modal h1, .modal h2, .modal h3, [data-modal] h1, [data-modal] h2, [data-modal] h3 {
            color: #0F172A !important;
        }

        .modal input, .modal select, .modal textarea {
            width: 100% !important;
        }

        .modal input::placeholder, 
        .modal textarea::placeholder,
        [data-modal] input::placeholder,
        [data-modal] textarea::placeholder {
            color: #94A3B8 !important;
        }

        /* Speed Test Premium Fixes */
        .speedtest-modal {
            background: #FFFFFF !important;
            color: #0F172A !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1) !important;
        }
        
        .speedtest-modal * {
            color: inherit;
        }

        .modal-overlay {
            background: rgba(0,0,0,0.6) !important;
            backdrop-filter: blur(6px) !important;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

</head>

<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>

</html>
