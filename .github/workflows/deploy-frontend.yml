name: Deploy Frontend (Firebase Hosting)

# Auto-deploys the Vite frontend to Firebase Hosting on every push to main.
# Backend auto-deploys separately via Render (render.yaml, autoDeploy: true).
#
# REQUIRED REPO CONFIG (Settings → Secrets and variables → Actions):
#   Secrets: FIREBASE_SERVICE_ACCOUNT_AP_CLICK_OPTICX = service-account JSON with
#            "Firebase Hosting Admin" + "Cloud Datastore User" roles
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (public-by-design),
#              VITE_BACKEND_URL, VITE_SUPABASE_REDIRECT_URL,
#              VITE_VAPI_PUBLIC_KEY, VITE_CLOUDINARY_CLOUD_NAME

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci breaks on Windows-generated lock files (rollup optional native deps,
      # npm/cli#4828): "Cannot find module @rollup/rollup-linux-x64-gnu".
      # npm install resolves the correct platform-specific optional dependencies.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_SUPABASE_REDIRECT_URL: ${{ vars.VITE_SUPABASE_REDIRECT_URL }}
          VITE_VAPI_PUBLIC_KEY: ${{ vars.VITE_VAPI_PUBLIC_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AP_CLICK_OPTICX }}
          channelId: live
          projectId: ap-click-opticx

      - name: Deploy locked-down Firestore rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AP_CLICK_OPTICX }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx --yes firebase-tools@latest deploy --only firestore:rules --project ap-click-opticx --force
        env:
          CI: 'true'
